[project]
name = "mtah-possession"
version = "0.1.0"
description = "Frame-level football ball possession (H/A/D) from noisy automatic tracking data"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
